<!doctype html><meta charset="utf-8">
<style>
body{font-family:sans-serif}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.c{text-align:center;break-inside:avoid;font-size:18px}
</style>
<div class="g" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const base=location.href.replace('qr.html','')+'?p=';
for(let i=1;i<=35;i++){
  const d=document.createElement('div');d.className='c';
  const q=document.createElement('div');d.appendChild(q);
  d.append(i);
  document.getElementById('g').appendChild(d);
  new QRCode(q,{text:base+i,width:160,height:160});
}
</script>
